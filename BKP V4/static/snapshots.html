<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Archives du planning</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  body{font-family:system-ui,Arial;margin:0;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#111;min-height:100vh;display:flex;flex-direction:column}
  header{padding:24px 40px;border-bottom:1px solid rgba(148,163,184,.3);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(6px)}
  h2{margin:0;font-size:26px;color:#0f172a}
  main{flex:1;padding:24px 40px;display:flex;gap:32px;align-items:flex-start;min-height:0}
  .list-panel{width:340px;flex-shrink:0}
  .list-card{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.12);padding:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:400px}
  .list-scroll{overflow-y:auto;flex:1}
  table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.12)}
  th,td{padding:10px 12px;font-size:13px;border-bottom:1px solid #edf1f7;text-align:left}
  th{background:#f1f5f9;text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:12px;color:#475569}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background-color .2s ease}
  tbody tr:hover{background:#f8fafc}
  tbody tr.selected{background:#e0edff}
  button{border:none;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .btn{background:#2463eb;color:#fff}
  .ghost{background:#eef2ff;color:#1d4ed8}
  .danger{background:#fee2e2;color:#b91c1c}
  .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .badge.draft{background:#e2e8f0;color:#1e3a8a}
  .badge.prévisionnel{background:#fff7d6;color:#92400e}
  .badge.valide{background:#dcfce7;color:#166534}
  select{border:1px solid #cbd5f5;border-radius:8px;padding:5px 8px;font-size:12px;background:#f8fafc}
  #preview{background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.1);padding:24px;display:flex;flex-direction:column;gap:16px;min-height:300px;flex:1;max-height:calc(100vh - 160px);overflow:auto}
  #preview h3{margin:0;font-size:20px;color:#0f172a}
  #preview pre{background:#0f172a;color:#f8fafc;padding:12px;border-radius:10px;overflow:auto;font-size:12px;max-height:320px}
  .muted{color:#64748b;font-size:12px}
  .actions{display:flex;gap:8px}
  .plan-table{border-collapse:collapse;width:100%;margin-top:12px}
  .plan-table th,.plan-table td{border:1px solid #e5e7eb;padding:6px 8px;font-size:12px;vertical-align:top}
  .plan-table th{background:#f8fafc;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  .tag{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin:1px 0;padding:3px 6px;border-radius:8px}
  .tag.base{background:#eef6ff;border:1px solid #d0e2ff}
  .tag.adjust{background:#eaffea;border:1px solid #bcebbb}
  .tag.replacement{background:#fff0e0;border:1px solid #ffcf8a}
  .tag.modified{box-shadow:0 0 0 2px rgba(255,193,7,.45)}
  .tag.ghost{opacity:.5;text-decoration:line-through}
  .day-total{margin-top:4px;font-size:11px;text-align:right;font-weight:600;color:#334155}
  .ok{color:#15803d;font-weight:600}
  .ko{color:#b91c1c;font-weight:600}
  .plan-wrapper{border-radius:14px;border:1px solid #e2e8f0;overflow:auto;max-width:100%;background:#f8fafc;padding:12px}
  @media (max-width: 1200px){
    main{flex-direction:column}
    .list-panel{width:100%}
    .list-card{height:auto;max-height:40vh}
    #preview{max-height:none}
  }
</style>
</head>
<body>
<header>
  <h2>Archives du planning</h2>
  <div style="display:flex;gap:8px">
    <a href="/" class="ghost" style="text-decoration:none;padding:8px 12px;display:inline-flex;align-items:center;border-radius:8px">Retour planning</a>
  </div>
</header>
<main>
  <section class="list-panel">
    <div class="list-card">
      <div class="list-scroll">
        <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Semaine</th>
          <th>Statut</th>
          <th>Contraintes</th>
          <th>Créé le</th>
          <th>Créneaux</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="snapBody">
        <tr><td colspan="7" class="muted">Chargement…</td></tr>
      </tbody>
    </table>
      </div>
    </div>
  </section>
  <aside id="preview">
    <h3>Aucune archive sélectionnée</h3>
    <p class="muted">Choisissez une archive pour afficher son contenu. Vous pourrez la télécharger au format JSON.</p>
  </aside>
</main>
<script src="snapshots.js"></script>
</body>
</html>
